name: Daily Supabase backup

on:
  schedule:
    # 07:00 UTC daily. GitHub may delay scheduled runs a bit under load; that's fine for a backup.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's snapshot and upload to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/backup-supabase.sh
